[project]
name = "rb-llmkit"
# Версия — из git-тега vX.Y.Z (uv-dynamic-versioning); строку `version =` не добавлять.
dynamic = ["version"]
description = "Общий LLM-слой: цепочки моделей, кэш, учёт расходов"
readme = "README.md"
authors = [
    { name = "Roman Bolandau" }
]
requires-python = ">=3.11"
dependencies = [
    "litellm==1.102.1",
    "instructor>=1.17",
    "pydantic>=2",
    "keyring>=25",
    "platformdirs>=4",
    "typer>=0.12",
    "rich>=13",
    "tomli-w>=1",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn"]

[project.scripts]
llm = "llmkit.cli.main:main"

[project.urls]
Repository = "https://github.com/bolandeu/llmkit"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.uv]
# Пересобирать editable-установку, когда сдвигается коммит или тег: `--version` следует за тегом.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.cli-generator]
# Где scripts/check_command_docstrings.py (git pre-commit + хуки Claude Code) ищет
# команды: у llmkit они в src/*/cli/*.py (не commands/), регистрация — `@app.command`.
commands = "src/*/cli/*.py"

# Внешние программы (стандарт §12); гейт сверяет список с src/ в обе стороны.
[[tool.rb.external]]
name = "claude"
required = false
check = "claude --version"
why = "провайдер claude-cli (подписка Claude): transports/claude_cli.py, `llm auth login/logout claude`; путь переопределяет CLAUDE_COMMAND"

[tool.hatch.build.targets.wheel]
packages = ["src/llmkit"]

[tool.hatch.build.targets.wheel.force-include]
# Установленный CLI читает отсюда [[tool.rb.external]] для `llm describe --json` (opencli.py).
"pyproject.toml" = "llmkit/_pyproject.toml"

[dependency-groups]
# Мутационное тестирование — периодически и перед крупными релизами, не в гейте:
# `uv run --group mutation mutmut run`, затем `mutmut results` / `mutmut browse`.
# Нужен fork(): macOS/Linux. Настройки — [tool.mutmut] ниже.
mutation = ["mutmut>=3.3"]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "syrupy>=4.8",
    "towncrier>=24.8",
    "ty>=0.0.80",
]

# Changelog из фрагментов: каждое изменение — файл changelog.d/+<slug>.<type>.md
# (`uv run towncrier create +<slug>.<type>.md -c "..."`); собирает scripts/release.py.
[tool.towncrier]
filename = "CHANGELOG.md"
directory = "changelog.d"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.pytest.ini_options]
# Только tests/: mutmut оставляет копию дерева в mutants/.
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.mutmut]
source_paths = ["src/llmkit"]
also_copy = ["scripts/", "pyproject.toml"]  # их читают тесты (test_scripts.py, проверки дистрибутива)
pytest_add_cli_args = ["--no-cov"]  # fail_under убил бы каждого мутанта
# only_mutate = ["*/db/normalize.py"]  # по модулю за раз

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# Порог — по факту на момент перехода на стандарт; поднимать, не опускать.
fail_under = 85
show_missing = true

[tool.ty.terminal]
# Гейт валят только ошибки; ty >= 0.0.84 иначе выходит с 1 и на предупреждениях.
error-on-warning = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# Интерфейс и комментарии на русском: кириллица и типографские тире — норма.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]
# S603/S607: скрипты вызывают git/uv фиксированными списками аргументов, без shell.
"scripts/*" = ["S101", "S105", "S106", "S603", "S607", "T201"]

[tool.ruff.lint.flake8-bugbear]
# Стиль Typer `param: T = typer.Option(...)` — вызов в значении по умолчанию намеренно.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
