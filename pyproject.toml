[project]
name = "rb-llmkit"
# Версия — из git-тега vX.Y.Z (uv-dynamic-versioning); строку `version =` не добавлять.
dynamic = ["version"]
description = "Shared LLM layer: model calls through a gateway with typed answers and spend accounting."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Roman Bolandau" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "platformdirs>=4",
    "typer>=0.27,<0.29",
    "rich>=13",
    "httpx>=0.27",
    # Рендер шаблонов промптов (template.py): точный пин — используются внутренности движка (Ctx, _render).
    "combustache==3.0.1",
]

[project.scripts]
llm = "llmkit.cli.main:main"

[project.urls]
Repository = "https://homeserver.tailee01ab.ts.net:3000/bolandeu/llmkit"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.uv]
# Пересобирать editable-установку, когда сдвигается коммит или тег: `--version` следует за тегом.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.cli-generator]
# Где scripts/check_command_docstrings.py (checks Antagor) ищет
# команды: у llmkit они в src/*/cli/*.py (не commands/), регистрация — `@app.command`.
commands = "src/*/cli/*.py"

# Установка (Standard, Install): инструмент для людей на Mac, ставится и на homeserver.
[tool.rb.install]
homeserver = ["rbtools"]
mac = true

[tool.hatch.build.targets.sdist]
# What a release must not carry: the agent's own files, the forge configs and the dev tooling. The wheel is
# narrow already (`packages = ["src/<pkg>"]`); this is about the sdist, which is otherwise a copy of the repo.
exclude = [
  "/.agents",
  "/.claude",
  "/.claude-plugin",
  "/.gitea",
  "/.github",
  "/docs",
  "/scripts",
  "/uv.lock",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/CODING_STANDARDS.md",
  "/CONTEXT.md",
  "/.copier-answers.yml",
  "^\\.gitignore$",
  "/.gitleaks.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llmkit"]

[tool.hatch.build.targets.wheel.force-include]
# Установленный CLI читает отсюда [[tool.rb.external]] для `llm describe --json` (opencli.py).
"pyproject.toml" = "llmkit/_pyproject.toml"

[dependency-groups]
# Мутационное тестирование — периодически и перед крупными релизами, не в гейте:
# `uv run --group mutation mutmut run`, затем `mutmut results` / `mutmut browse`.
# Нужен fork(): macOS/Linux. Настройки — [tool.mutmut] ниже.
mutation = ["mutmut>=3.3"]
dev = [
    "jsonschema>=4.23",
    "packaging>=24.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "syrupy>=4.8",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
# Только tests/: mutmut оставляет копию дерева в mutants/.
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.mutmut]
source_paths = ["src/llmkit"]
also_copy = ["scripts/", "pyproject.toml"]  # их читают тесты (проверки дистрибутива)
pytest_add_cli_args = ["--no-cov"]  # fail_under убил бы каждого мутанта
# only_mutate = ["*/db/normalize.py"]  # по модулю за раз

[tool.coverage.run]
source = ["src"]
# Ядро по умолчанию в Python 3.14 растёт по памяти на каждый вызов CLI в тестах.
core = "ctrace"

[tool.coverage.report]
# Порог — по факту на момент перехода на стандарт; поднимать, не опускать.
fail_under = 85
show_missing = true

[tool.ty.terminal]
# Гейт валят только ошибки; ty >= 0.0.84 иначе выходит с 1 и на предупреждениях.
error-on-warning = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# Интерфейс и комментарии на русском: кириллица и типографские тире — норма.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# `llmkit.*` — свой пакет, даже когда модуль удалён (иначе isort считает его чужим).
known-first-party = ["llmkit"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]
# S603/S607: скрипты вызывают git/uv фиксированными списками аргументов, без shell.
"scripts/*" = ["S101", "S105", "S106", "S603", "S607", "T201"]

[tool.ruff.lint.flake8-bugbear]
# Стиль Typer `param: T = typer.Option(...)` — вызов в значении по умолчанию намеренно.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
