[project]
name = "llmkit"
version = "0.1.0"
description = "Общий LLM-слой: цепочки моделей, кэш, учёт расходов"
readme = "README.md"
authors = [
    { name = "Roman Bolandau" }
]
requires-python = ">=3.11"
dependencies = [
    "litellm==1.102.0",
    "instructor>=1.17",
    "pydantic>=2",
    "keyring>=25",
    "platformdirs>=4",
    "typer>=0.12",
    "rich>=13",
    "tomli-w>=1",
]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn"]

[project.urls]
Repository = "https://github.com/bolandeu/llmkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmkit"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# Интерфейс и комментарии на русском: кириллица и типографские тире — норма.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]
"scripts/*" = ["S101", "S105", "S106", "T201"]
