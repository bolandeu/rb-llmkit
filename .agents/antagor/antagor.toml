schema = 1
mode = "fast"
prefix = "LLMKIT"
name = "llmkit"
worker = "pi"
checks = [
  "uv run pytest -q",  # 19 s, 680 tests, coverage gate 85% inside
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run ty check",
  "python3 scripts/check_command_docstrings.py",
]
heavy = ["rb-release check"]

# the workserver, 48 cores (the Human 28.10: at least four tasks at once); heavy checks queue on the machine
parallel = 4

# fast mode: a worker holds a whole block in its context; the fuses are not targets
notify_remind_min = 15  # a release waits for the Human for hours; the 3-minute nag drowned the work
setup = ["uv sync"]  # before a full gate run: a merged tree drops dependencies (litellm, sqlalchemy), the venv keeps them, tests/test_deps.py pins their absence

[limits]
max_files = 150
max_lines = 4000
max_prompt_tokens = 60000

[protocol]
test_command = "uv run pytest -q --no-cov"  # --no-cov: a task runs its own test_paths, coverage gate lives in `checks`

[docs]
living = ["docs/architecture.md", "docs/cli-conventions.md", "docs/testing.md", "docs/decisions.md"]

[review]
worker = "pi-glm"  # another model than the author (the Human, 6.11)
required_types = ["feature", "bugfix"]  # chore and docs: the short path without review

[publish]
versioning = "semver"
changelog = "CHANGELOG.md"
deploy_command = "git push origin main --follow-tags"
gate = "local"
gate_command = 'uvx --from "git+https://homeserver.tailee01ab.ts.net:3000/bolandeu/cli-generator.git@v1.27.3#subdirectory=gate" rb-release check'
env = { UV_PYTHON = "3.11" }
regenerate = { "uv.lock" = "uv lock" }

[connector]
webhook_secret = "PLANE_WEBHOOK_SECRET_TOOLS"
kind = "plane"
base_url = "https://homeserver.tailee01ab.ts.net:8443"
workspace = "tools"
project_id = "c03c511f-2d11-46c2-8ba7-6dd62235ee46"
humans = ["r.bolandau@gmail.com"]

[connector.states]
ideas = "Backlog"
queue = "Todo"
in_progress = "In Progress"
in_review = "In Review"
publish = "Publishing"
done = "Done"
cancelled = "Cancelled"

[daemon]
enabled = true

[workers.pi-glm]  # the reviewer: kind pi, model from [model_policy.pi-glm]
kind = "pi"
args = []

[architect]
floor = [{ client = "pi", min = "9router/deepseek-4.1-flash", min_effort = "max" }]

[architect.order]
pi = ["deepseek-4.1-flash", "deepseek-v4.1-flash"]  # matched inside the declared name
